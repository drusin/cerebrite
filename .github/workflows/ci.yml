name: CI

# Builds the Windows and Linux desktop targets on every push, per
# .scratch/cerebrite-mvp-implementation/issues/01-project-scaffold.md.
# android-smoke-apk.yml separately proves Tauri's Android target builds at
# all (via a throwaway scaffolded app, nothing committed) - it does not build
# this app's own Android target. That's ticket 15 (android-build-and-editor-
# parity), which also wires Android into this pipeline.
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build desktop app
        working-directory: src-tauri
        run: cargo build --release

      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: cerebrite-${{ matrix.os }}
          path: src-tauri/target/release/cerebrite${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error
