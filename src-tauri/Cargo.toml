[package]
name = "cerebrite"
version = "0.1.0"
description = "Cerebrite: a git-native, markdown-based knowledge base"
authors = ["Cerebrite contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cerebrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
# `vendored-openssl` builds and statically links openssl-src instead of
# relying on a system OpenSSL install: required for cross-compiling to
# Android, where no OpenSSL dev headers/libs exist for the target triple.
# Same fix already validated for git2 in the 06 smoke-test CI workflow
# (.github/workflows/android-smoke-apk.yml) -- ticket 15 hit the identical
# `openssl-sys` "Could not find directory of OpenSSL installation" failure
# cross-compiling the real app to aarch64-linux-android without it.
git2 = { version = "0.19", features = ["vendored-openssl"] }
pulldown-cmark = "0.12"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
regex = "1"
# Only needed for the oneshot channel that bridges tauri-plugin-dialog's
# non-blocking `pick_folder` callback into an `.await`-able command (see
# `pick_vault_folder` in lib.rs): the plugin's `blocking_pick_folder` is
# `#[cfg(desktop)]`-only and doesn't exist on Android at all, which is a
# real compile-time failure discovered cross-compiling ticket 15's real app
# to aarch64-linux-android, not a hypothetical.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
