[package]
name = "cerebrite"
version = "0.1.0"
description = "Cerebrite: a git-native, markdown-based knowledge base"
authors = ["Cerebrite contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cerebrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
# `vendored-openssl` builds and statically links openssl-src instead of
# relying on a system OpenSSL install: required for cross-compiling to
# Android, where no OpenSSL dev headers/libs exist for the target triple.
# Same fix already validated for git2 in the 06 smoke-test CI workflow
# (.github/workflows/android-smoke-apk.yml) -- ticket 15 hit the identical
# `openssl-sys` "Could not find directory of OpenSSL installation" failure
# cross-compiling the real app to aarch64-linux-android without it.
# `ssh_key_from_memory` (ticket 05): lets `Cred::ssh_key_from_memory` hand
# libssh2 key material directly rather than a file path -- needed since
# Cerebrite generates/imports SSH keys itself rather than relying on files
# on disk. Confirmed to compile against libssh2-sys's vendored-OpenSSL
# backend (the precondition `ssh_key_from_memory` needs) and smoke-tested
# with an ed25519 key specifically -- see `connection.rs`'s
# `ssh_key_from_memory_smoke_test` and ticket 05's research doc
# (.scratch/git-provider-integration/issues/03-ssh-key-management-research.md).
git2 = { version = "0.19", features = ["vendored-openssl", "ssh_key_from_memory"] }
pulldown-cmark = "0.12"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
regex = "1"
# Only needed for the oneshot channel that bridges tauri-plugin-dialog's
# non-blocking `pick_folder` callback into an `.await`-able command (see
# `pick_vault_folder` in lib.rs): the plugin's `blocking_pick_folder` is
# `#[cfg(desktop)]`-only and doesn't exist on Android at all, which is a
# real compile-time failure discovered cross-compiling ticket 15's real app
# to aarch64-linux-android, not a hypothetical.
tokio = { version = "1", features = ["sync"] }
# Credential storage (ADR-0013 / ticket 02): `keyring-core` is the
# storage-agnostic front, with one platform store crate per target and the
# in-process `sample` mock store (test-only) used to exercise the credential
# module without a real OS keychain in CI/sandboxes.
keyring-core = "1"
# In-app ed25519 SSH key generation and OpenSSH-format (de)serialization
# (ticket 05) -- no dependency on a system `ssh-keygen` binary. Chosen over
# `ed25519-dalek` (archived/moved upstream, see ticket 05's research doc)
# and `russh-keys` (pulls in a full SSH client stack Cerebrite doesn't need,
# since git2/libssh2 already is one). `encryption` is needed to parse an
# imported key that may be passphrase-protected (Cerebrite never decrypts
# it itself -- see `ssh_key.rs` -- but must still validate it parses).
ssh-key = { version = "0.6", features = ["ed25519", "getrandom", "encryption"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust (zbus) Secret Service store -- avoids a libdbus-sys build
# dependency, which matters for the same cross-compilation reasons git2 above
# already needed `vendored-openssl` for.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
keyring-core = { version = "1", features = ["sample"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
