<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerebrite</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Ticket 04: the vault picker is now the `surfaces/vault-picker/`
         Vue island -- it shows/hides itself from `state/ui.ts`'s
         `vaultView` instead of a DOM `hidden` attribute. -->
    <div id="vault-picker-root"></div>

    <!-- Ticket 10: the guided clone wizard (full-screen, no vault/window yet
         to anchor a modal on top of) and the standalone "git clone" manual
         form (variant B's transparent, full-git-vocabulary door into the
         same `clone_and_open_vault` command) are now the
         `surfaces/clone-wizard/`/`surfaces/clone-manual-form/` Vue islands --
         each shows/hides itself from `state/ui.ts`'s `vaultView` instead of
         a DOM `hidden` attribute. -->
    <div id="clone-wizard-root"></div>
    <div id="clone-manual-root"></div>

    <div id="workspace" class="workspace" hidden>
      <!-- Android-proxy layout only (viewport-width heuristic, see main.ts):
           hamburger trigger for the hidden-by-default drawer. Hidden outright
           on desktop via CSS. -->
      <button id="sidebar-open-button" class="sidebar-open-button" type="button" aria-label="Open sidebar">☰</button>
      <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <!-- Opens the search modal (ticket 03: `surfaces/search/`,
               mounted at `#search-modal-root`). -->
          <button id="search-button" class="search-button" type="button">🔍 Search</button>
          <button id="settings-button" class="sidebar-icon-button" type="button" aria-label="Settings" title="Settings (Ctrl/Cmd+,)">⚙</button>
          <button id="sidebar-collapse-toggle" class="sidebar-collapse-toggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">←</button>
          <button id="sidebar-close-button" class="sidebar-close-button" type="button" aria-label="Close sidebar">✕</button>
        </div>

        <!-- Ticket 08: the sidebar's Recent list is now the
             `surfaces/recent/` Vue island, mounted here. -->
        <div id="recent-root"></div>

        <!-- Ticket 08: the sidebar's "All pages" list (New page, Today) is
             now the `surfaces/page-list/` Vue island, mounted here.
             `main.ts` keeps a typed handle to it (`pageListHandle`), the
             same imperative-escape-hatch pattern as the article island's
             `scrollToHeading`, so the still-vanilla sidebar rail's own "+"
             button can trigger the same "new page" flow. -->
        <div id="page-list-root"></div>

        <!-- Ticket 09: the sidebar's Trash list (with Empty trash) is now
             the `surfaces/trash/` Vue island, mounted here. -->
        <div id="trash-root"></div>

        <!-- Ticket 02: a persistent, quiet sync-status indicator -- never a
             toast/banner (per issue 09's resolved decision). A Vue island
             (`surfaces/sync-indicator/`) mounted here by `main.ts`; reads
             `state/sync.ts` and opens the popup island (never auto-opens). -->
        <div id="sync-indicator-footer-root" class="sidebar-footer"></div>
      </aside>

      <!-- Collapsed-state rail (desktop only): shown in place of the full
           sidebar once it's collapsed, so there's always a visible way back
           in plus quick access to the two most common actions. -->
      <div id="sidebar-rail" class="sidebar-rail">
        <button id="sidebar-rail-expand" class="sidebar-rail-button" type="button" aria-label="Expand sidebar" title="Expand sidebar">→</button>
        <button id="sidebar-rail-search" class="sidebar-rail-button" type="button" aria-label="Search" title="Search">🔍</button>
        <button id="sidebar-rail-new-page" class="sidebar-rail-button" type="button" aria-label="New page" title="New page">+</button>
        <button id="sidebar-rail-settings" class="sidebar-rail-button" type="button" aria-label="Settings" title="Settings (Ctrl/Cmd+,)">⚙</button>
        <!-- Ticket 02: same indicator as the expanded sidebar's footer, just
             icon-only -- another instance of the same
             `surfaces/sync-indicator/` island. -->
        <div id="sync-indicator-rail-root"></div>
      </div>

      <!-- Ticket 02: the sync-status popup -- a Vue island
           (`surfaces/sync-indicator/SyncPopupContainer.vue`) mounted here.
           Opened only by clicking the footer/rail icon, never auto-opened.
           Closed by Escape or clicking outside it (handled inside the
           island itself now, not by `init`'s document listeners). -->
      <div id="sync-popup-root"></div>

      <!-- Ticket 07: the whole article view -- title row (rename/delete),
           trash banner (Restore), the editor, and backlinks -- is now the
           `surfaces/article/` Vue island (mounted in main.ts). It renders
           its own `.page-view`/`.page-article`/etc. markup; this is just
           the mount point. -->
      <div id="article-root"></div>

      <!-- Ticket 03: the search modal -- a Vue island
           (`surfaces/search/SearchModalContainer.vue`) mounted here.
           Opened by the sidebar's Search button and Ctrl/Cmd+K
           (`state/ui.ts`'s `openSearchModal`), closed by Escape or
           clicking outside (handled inside the island itself). -->
      <div id="search-modal-root"></div>

      <!-- Ticket 12: Settings is now the `surfaces/settings/` Vue island,
           mounted here -- opened via the sidebar's gear button (expanded and
           collapsed-rail states) and Ctrl/Cmd+,, closed by Escape or
           clicking outside the modal card (both owned by
           `components/Modal.vue` now). Every setting still applies live. -->
      <div id="settings-modal-root"></div>

      <!-- Ticket 11: the guided connect wizard is now the
           `surfaces/connect-wizard/` Vue island, mounted here -- a compact
           modal (`components/Modal.vue`) layered above the still-vanilla
           Settings modal, shown from `state/ui.ts`'s `modal` state
           (`'connectWizard'`), same as before. -->
      <div id="connect-wizard-root"></div>
    </div>
  </body>
</html>
