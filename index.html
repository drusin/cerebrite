<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerebrite</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <section id="vault-picker" class="vault-picker" hidden>
      <h1>Cerebrite</h1>
      <p>Select a folder to use as your vault. It doesn't need to be a git repo yet.</p>
      <button id="select-vault-button" type="button">Select vault folder…</button>
      <p id="vault-picker-error" class="error" hidden></p>
    </section>

    <div id="workspace" class="workspace" hidden>
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h2>All pages</h2>
          <button id="new-page-button" type="button">New page</button>
        </div>
        <ul id="page-list" class="page-list"></ul>
      </aside>
      <main id="page-view" class="page-view">
        <p id="page-view-empty" class="page-view-empty">Select a page from the list.</p>
        <article id="page-article" hidden>
          <h1 id="page-title"></h1>
          <div id="page-body" class="milkdown-root"></div>
          <section id="backlinks-section" class="backlinks-section">
            <h2>Backlinks</h2>
            <p id="backlinks-empty" class="backlinks-empty" hidden>No backlinks yet.</p>
            <ul id="backlinks-list" class="backlinks-list"></ul>
          </section>
        </article>
      </main>
    </div>
  </body>
</html>
