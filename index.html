<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerebrite</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <section id="vault-picker" class="vault-picker" hidden>
      <h1>Cerebrite</h1>
      <p>Select a folder to use as your vault. It doesn't need to be a git repo yet.</p>
      <button id="select-vault-button" type="button">Select vault folder…</button>
      <p id="vault-picker-error" class="error" hidden></p>
    </section>

    <div id="workspace" class="workspace" hidden>
      <!-- Android-proxy layout only (viewport-width heuristic, see main.ts):
           hamburger trigger for the hidden-by-default drawer. Hidden outright
           on desktop via CSS. -->
      <button id="sidebar-open-button" class="sidebar-open-button" type="button" aria-label="Open sidebar">☰</button>
      <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <button id="sidebar-collapse-toggle" class="sidebar-collapse-toggle" type="button" aria-label="Collapse sidebar">☰</button>
          <!-- Ticket 13 stub: reserves the "prominent Search entry point" UI
               slot per issue 08. No search UI/modal here -- that's ticket
               13's job. -->
          <button id="search-button" class="search-button" type="button">🔍 Search</button>
          <button id="sidebar-close-button" class="sidebar-close-button" type="button" aria-label="Close sidebar">✕</button>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-header">
            <h2>Recent</h2>
          </div>
          <ul id="recent-list" class="page-list recent-list"></ul>
          <p id="recent-empty" class="sidebar-empty-hint">No pages opened yet.</p>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-header">
            <h2>All pages</h2>
            <button id="new-page-button" type="button">New page</button>
          </div>
          <ul id="page-list" class="page-list"></ul>
        </div>

        <div class="sidebar-section">
          <button id="today-button" class="today-button" type="button">Today</button>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-header sidebar-trash-header">
            <h2>Trash</h2>
            <button id="empty-trash-button" type="button">Empty trash</button>
          </div>
          <ul id="trash-list" class="page-list trash-list"></ul>
        </div>
      </aside>
      <main id="page-view" class="page-view">
        <p id="page-view-empty" class="page-view-empty">Select a page from the list.</p>
        <article id="page-article" hidden>
          <div class="page-title-row">
            <h1 id="page-title"></h1>
            <button id="delete-page-button" type="button" hidden>Delete page</button>
          </div>
          <p id="page-trash-banner" class="page-trash-banner" hidden>
            This page is in trash.
            <button id="restore-page-button" type="button">Restore</button>
          </p>
          <div id="page-body" class="milkdown-root"></div>
          <section id="backlinks-section" class="backlinks-section">
            <h2>Backlinks</h2>
            <p id="backlinks-empty" class="backlinks-empty" hidden>No backlinks yet.</p>
            <ul id="backlinks-list" class="backlinks-list"></ul>
          </section>
        </article>
      </main>
    </div>
  </body>
</html>
